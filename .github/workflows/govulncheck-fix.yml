name: Vulnerability Fix

on:
  schedule:
    # Run daily at 07:00 UTC (after deps-test at 06:00)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  govulncheck-fix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Use PAT if available to allow the created PR to trigger CI.
          # Falls back to GITHUB_TOKEN (PR won't trigger CI, but auto-merge
          # still works if no required status checks are configured).
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        id: vulncheck
        run: |
          if govulncheck -json ./... > /tmp/vulncheck.json 2>&1; then
            echo "vulnerable=false" >> "$GITHUB_OUTPUT"
          else
            echo "vulnerable=true" >> "$GITHUB_OUTPUT"
          fi

          # Detect stdlib vulns (Fixed in stdlib versions newer than current)
          if grep -q '"stdlib"' /tmp/vulncheck.json 2>/dev/null; then
            echo "has_stdlib_vulns=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_stdlib_vulns=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update vulnerable dependencies
        if: steps.vulncheck.outputs.vulnerable == 'true'
        run: |
          go get -u ./...
          go mod tidy

      - name: Bump Go toolchain for stdlib fixes
        if: steps.vulncheck.outputs.has_stdlib_vulns == 'true'
        run: |
          # Get the latest patch version for our Go minor release
          CURRENT=$(grep '^go ' go.mod | awk '{print $2}')
          MINOR=$(echo "$CURRENT" | grep -oE '^[0-9]+\.[0-9]+')

          # Query available Go versions and find the latest patch
          LATEST=$(curl -sL 'https://go.dev/dl/?mode=json' \
            | grep -oE "go${MINOR}\.[0-9]+" \
            | sort -t. -k3 -n \
            | tail -1 \
            | sed 's/^go//')

          if [ -z "$LATEST" ]; then
            echo "Could not determine latest Go ${MINOR}.x version, skipping toolchain bump"
            exit 0
          fi

          if [ "$CURRENT" != "$LATEST" ]; then
            echo "Bumping Go directive: $CURRENT -> $LATEST"
            sed -i "s/^go ${CURRENT}$/go ${LATEST}/" go.mod
            # Allow Go to auto-download the newer toolchain for mod tidy
            GOTOOLCHAIN=auto go mod tidy
          else
            echo "Already on latest Go ${MINOR}.x ($CURRENT)"
          fi

      - name: Check for changes
        if: steps.vulncheck.outputs.vulnerable == 'true'
        id: changes
        run: |
          if git diff --quiet go.mod go.sum; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify fix
        if: steps.vulncheck.outputs.vulnerable == 'true' && steps.changes.outputs.changed == 'true'
        env:
          GOTOOLCHAIN: auto
        run: |
          go build ./...
          go test -short ./...

          # Re-run govulncheck; allow exit code 3 (vulns found) only if
          # remaining vulns are exclusively in stdlib with no available fix
          # for the current Go minor series.
          if govulncheck ./... 2>&1; then
            echo "All vulnerabilities resolved."
          else
            # Check if only stdlib vulns remain (no fix available in our minor series)
            REMAINING=$(govulncheck -json ./... 2>&1 || true)
            NON_STDLIB=$(echo "$REMAINING" | grep -c '"module"' || true)
            if [ "$NON_STDLIB" -gt 0 ]; then
              echo "::error::Third-party dependency vulnerabilities remain after update"
              exit 1
            fi
            echo "::warning::Only stdlib vulnerabilities remain — requires a new Go minor release to fix"
          fi

      - name: Create PR
        if: steps.vulncheck.outputs.vulnerable == 'true' && steps.changes.outputs.changed == 'true'
        run: |
          BRANCH="govulncheck-fix-$(date +%Y%m%d)"

          # Clean up stale branch if it exists
          git push origin --delete "$BRANCH" 2>/dev/null || true

          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "$(cat <<'EOF'
          fix(deps): update dependencies to resolve vulnerabilities

          Automated fix for vulnerabilities detected by govulncheck.
          EOF
          )"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "fix(deps): resolve govulncheck vulnerabilities" \
            --body "$(cat <<'EOF'
          ## Summary
          - Vulnerabilities detected by `govulncheck`
          - Dependencies updated and verified (build + test pass)
          - Go toolchain bumped to latest patch if stdlib vulns detected

          Automated PR created by the Vulnerability Fix workflow.
          EOF
          )" \
            --label "dependencies" \
            --head "$BRANCH")

          gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
